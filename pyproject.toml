[project]
name = "tcc-testgen-pipeline"
version = "0.1.0"
description = "Experimental pipeline that evaluates LLM/SLM unit-test generation for C++ (TCC, UnB)."
requires-python = ">=3.11,<3.12"
dependencies = [
    "datasets==5.0.1",
    "matplotlib>=3.11.2",
    "pandas>=3.0.6",
    "pydantic>=2,<3",
    "scipy>=1.17.1",
    "streamlit>=1.66.1",
    "tree-sitter>=0.26,<0.27",
    "tree-sitter-cpp>=0.23,<0.24",
]

[dependency-groups]
dev = ["pytest", "ruff", "black"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
# importlib mode avoids basename collisions between tests/dataset and tests/sandbox;
# no cache provider keeps root-owned .pytest_cache out of the mounted working tree.
addopts = "--import-mode=importlib -p no:cacheprovider"
markers = ["integration: compila e executa C++ (serviço sandbox)"]

[tool.ruff]
line-length = 100

[tool.ruff.lint.per-file-ignores]
# Test builders use the keyword style `dict(a=1)` on purpose, for readability.
"tests/**" = ["C408"]

[tool.black]
line-length = 100
