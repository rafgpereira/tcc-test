services:
  app:                       # extraction, packaging, verification (has network)
    build: .
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    env_file: [{ path: .env, required: false }]   # long form must be a list; .env is optional
    environment: { HF_HOME: /tmp/hf }     # read-only root: Hugging Face cache on the tmpfs
    # Lets `http://host.docker.internal:11434` reach an Ollama running on the host (needed on Linux;
    # Docker Desktop already provides the name). Only here: `sandbox` stays without network.
    extra_hosts: ["host.docker.internal:host-gateway"]
    # The Git history, read only and only here (never in sandbox, which runs third-party code):
    # show-request looks up an old prompt template by its hash with git log / git cat-file.
    volumes: ["./data:/app/data", "./manifests:/app/manifests", "./.git:/app/.git:ro"]
    tmpfs: ["/tmp:size=2g"]

  sandbox:                   # runs third-party code: NO network
    build: .
    user: "0:0"              # only needed to drop privileges per execution (setuid)
    init: true               # PID 1 reaps the orphans of killed process groups (no zombie buildup)
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, SETUID, SETGID, KILL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 2048
    environment: { HOST_UID: "${HOST_UID:-1000}", HOST_GID: "${HOST_GID:-1000}" }
    volumes: ["./data:/app/data", "./manifests:/app/manifests"]
    # The exec option is mandatory: Docker mounts tmpfs as noexec by default, which would
    # prevent running the compiled binary.
    # /tmp and /dev/shm are 0700 root-only: they are world-writable by default, which would let
    # third-party code (uid 10000+) keep state between runs. The engine uses per-slot workdirs
    # under /sandbox and TMPDIR points there.
    tmpfs: ["/sandbox:exec,mode=0755,size=2g", "/tmp:mode=0700,size=512m", "/dev/shm:mode=0700,size=64m"]
